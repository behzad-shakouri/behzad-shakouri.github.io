# -------------------------------------------------------------------------------------
# Hugo Configuration
# -------------------------------------------------------------------------------------

# عنوان وبلاگ
title = "وبلاگ بهزاد شکوری"

# آدرس دقیق وبلاگ
baseURL = "https://behzad-shakouri.github.io/"

# تنظیم قالب اصلی
theme = ["FixIt"]

# تنظیمات کامل زبان فارسی و راست‌چین (RTL)
defaultContentLanguage = "fa"
languageCode = "fa-IR"
hasCJKLanguage = false

[languages.fa]
  weight = 1
  languageCode = "fa-IR"
  languageName = "فارسی"
  contentDir = "content"

# تنظیمات عمومی سئو و امکانات
enableEmoji = true
enableGitInfo = true
enableRobotsTXT = true
mainSections = ["posts"]
