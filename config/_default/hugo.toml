# -------------------------------------------------------------------------------------
# Hugo Configuration
# -------------------------------------------------------------------------------------

# عنوان وبلاگ
title = "وبلاگ بهزاد شکوری"

# آدرس دقیق وبلاگ
baseURL = "https://behzad-shakouri.github.io/"

# تنظیمات زبان فارسی و راست‌چین (طبق متغیرهای جدید هیوگو)
defaultContentLanguage = "fa"
locale = "fa-IR"
hasCJKLanguage = false

[languages.fa]
  weight = 1
  locale = "fa-IR"
  label = "فارسی"
  contentDir = "content"

# تنظیمات عمومی و سئو
enableEmoji = true
enableGitInfo = true
enableRobotsTXT = true
mainSections = ["posts"]

# فراخوانی صحیح ماژول قالب FixIt
[module]
  [[module.imports]]
    path = "github.com/hugo-fixit/FixIt"
