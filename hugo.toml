baseURL = 'https://behzad-shakouri.github.io/'
locale = 'fa-IR'
title = 'وبلاگ بهزاد شکوری'
theme = 'PaperMod'

defaultContentLanguage = 'fa'
defaultContentLanguageInSubdir = false

[params]
  dir = 'rtl'
  RTL = true
  env = 'production'
  description = 'وبلاگ شخصی بهزاد شکوری درباره مدیریت محصول و تفکر سیستمی'
  author = 'بهزاد شکوری'
  
  defaultTheme = 'auto'
  disableThemeToggle = false
  
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowWordNums = true
  ShowBreadCrumbs = true

  # متن کپی‌رایت فوتر
  copyright = '© ۲۰۲۶ بهزاد شکوری'

  # تنظیمات فهرست مطالب (Table of Contents)
  ShowToc = true
  TocOpen = true

  [params.toc]
    open = true

  # کادر خوش‌آمدگویی صفحه اصلی همراه با آیکون‌های ارتباطی
  [params.homeInfoParams]
    Title = 'به وبلاگ من خوش آمدید 👋'
    Content = 'اینجا درباره مدیریت محصول، تفکر سیستمی و یادداشت‌های روزانه می‌نویسم.'

  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://www.linkedin.com/in/behzad-shakouri/'

  [[params.socialIcons]]
    name = 'telegram'
    url = 'https://t.me/behzad_shakouri'

  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:shakoorib@gmail.com'

[languages]
  [languages.fa]
    label = 'فارسی'
    weight = 1
    locale = 'fa-IR'
    [languages.fa.params]
      dir = 'rtl'
      RTL = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    name = 'آرشیو'
    url = '/archives/'
    weight = 10
  [[menu.main]]
    name = 'دسته‌بندی‌ها'
    url = '/categories/'
    weight = 20
  [[menu.main]]
    name = 'برچسب‌ها'
    url = '/tags/'
    weight = 30
  [[menu.main]]
    name = 'جستجو'
    url = '/search/'
    weight = 40
  [[menu.main]]
    name = 'درباره من'
    url = '/about/'
    weight = 50

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
