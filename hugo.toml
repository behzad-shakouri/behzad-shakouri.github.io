baseURL = 'https://behzad-shakouri.github.io/'
locale = 'fa-IR'
title = 'وبلاگ بهزاد شکوری'
theme = 'PaperMod'

defaultContentLanguage = 'fa'
defaultContentLanguageInSubdir = false

# این خط باعث می‌شود تمام صفحات اتوماتیک هیوگو هم RTL شوند
[params]
  dir = 'rtl'
  env = 'production'
  description = 'وبلاگ شخصی بهزاد شکوری درباره مدیریت محصول و تفکر سیستمی'
  author = 'بهزاد شکوری'
  
  defaultTheme = 'auto'
  disableThemeToggle = false
  
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowWordNums = true
  
  [params.homeInfoParams]
    Title = 'به وبلاگ من خوش آمدید 👋'
    Content = 'اینجا درباره مدیریت محصول، تفکر سیستمی و یادداشت‌های روزانه می‌نویسم.'

[languages]
  [languages.fa]
    label = 'فارسی'
    weight = 1
    [languages.fa.params]
      dir = 'rtl'

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    name = 'آرشیو'
    url = '/archives/'
    weight = 10
  [[menu.main]]
    name = 'دسته‌بندی‌ها'
    url = '/categories/'
    weight = 20
  [[menu.main]]
    name = 'برچسب‌ها'
    url = '/tags/'
    weight = 30
  [[menu.main]]
    name = 'جستجو'
    url = '/search/'
    weight = 40
